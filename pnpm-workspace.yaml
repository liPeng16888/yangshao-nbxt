packages:
  - .
  - admin
  - desktop
  - server

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true
  protobufjs: false
  vue-demi: true
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.110'
  - '@ai-sdk/openai-compatible@3.0.67'
  - '@ai-sdk/provider-utils@5.0.58'
  - '@ai-sdk/provider@4.0.26'
  - ai@7.0.136
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - electron
  - electron-winstaller
  - esbuild
  - prisma
  - vue-demi
